<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KX Console</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --line: #e3e6eb; --text: #14181f; --muted: #667085;
    --accent: #2563eb; --accent-text: #fff; --ok: #16a34a; --warn: #d97706; --off: #98a2b3; --hover: #f0f2f5; --sel: #e8efff;
    --screen: #0b0e14; --screen-text: #8b95a7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1016; --panel: #151921; --line: #252b36; --text: #e8ebf0; --muted: #8b95a7;
      --accent: #5b8cff; --accent-text: #0b1020; --ok: #34d399; --warn: #fbbf24; --off: #5b6472; --hover: #1c212b; --sel: #1e2a47;
      --screen: #06080c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 300px 1fr; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 650; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  .brand #ver { font-size: 11px; opacity: .7; }
  .tools { padding: 12px 14px; display: grid; gap: 8px; }
  input[type=search] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  label.check { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; cursor: pointer; }
  ul { list-style: none; margin: 0; padding: 4px 8px 16px; overflow: auto; flex: 1; }
  .group { padding: 12px 10px 4px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  li button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 8px; background: none;
    color: inherit; font: inherit; text-align: left; cursor: pointer; }
  li button:hover { background: var(--hover); }
  li button[aria-current=true] { background: var(--sel); }
  li button:focus-visible { outline: 2px solid var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); flex: none; }
  .up .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .busy .dot { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 25%, transparent); }
  .mine .dot { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 8%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .mine .dot { animation: none; } }
  .sessions { border-top: 1px solid var(--line); padding: 10px 14px 12px; max-height: 32%; overflow: auto; }
  .sessions h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .sessions ul { padding: 0; overflow: visible; }
  .sessions li { display: flex; flex-direction: column; padding: 4px 0; font-size: 12px; color: var(--muted); }
  .sessions .tag { color: var(--text); }
  .sessions .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sessions .meta { opacity: .85; }
  .mini { padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line); background: none; color: var(--muted); font: inherit; font-size: 11px; cursor: pointer; }
  .mini:hover:not(:disabled) { color: var(--text); background: var(--hover); }
  .mini:disabled { opacity: .5; cursor: default; }
  .sessions .tag.live::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); margin-right: 6px; }
  .brand { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .icon { background: none; border: 0; color: var(--muted); font: inherit; font-size: 17px; line-height: 1; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .icon:hover, .gear:hover { background: var(--hover); color: var(--text); }
  .rowwrap { display: flex; align-items: center; gap: 2px; }
  .rowwrap .main { flex: 1; min-width: 0; width: auto; }
  .gear { flex: none; width: auto; display: block; background: none; border: 0; color: var(--muted); font: inherit; font-size: 15px; padding: 7px 8px; border-radius: 8px; cursor: pointer; opacity: .55; }
  .rowwrap:hover .gear, .gear:focus-visible { opacity: 1; }
  .gear:focus-visible, .icon:focus-visible { outline: 2px solid var(--accent); }
  .pw { font-size: 12px; flex: none; }
  .pw.on { color: var(--ok); } .pw.off { color: #e5484d; } .pw.partial { color: var(--warn); } .pw.unknown { color: var(--off); }
  .chip.pwr.on { color: var(--ok); } .chip.pwr.off { color: #e5484d; border-color: #e5484d; } .chip.pwr.partial { color: var(--warn); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(580px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { margin: 0; font-size: 16px; }
  .dlg-body { padding: 14px 18px; display: grid; gap: 10px; }
  .dlg-body h3 { margin: 6px 0 0; font-size: 13px; }
  .dlg-help { margin: 0; color: var(--muted); font-size: 12px; }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
  .dlg-note { margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--hover); font-size: 12px; } .dlg-note:empty { display: none; }
  .dlg-note.ok { color: var(--ok); } .dlg-note.bad { color: #e5484d; }
  .devs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; overflow: visible; }
  .devs li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
  .devs li.empty { color: var(--muted); justify-content: center; border-style: dashed; }
  .dev-info { display: flex; flex-direction: column; min-width: 0; font-size: 13px; }
  .dev-info .meta { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev-info .meta.ok { color: var(--ok); } .dev-info .meta.bad { color: #e5484d; }
  .dev-actions { display: flex; gap: 6px; flex: none; }
  .dbtn { width: auto; display: inline-block; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
  .dbtn:hover:not(:disabled) { background: var(--hover); } .dbtn:disabled { opacity: .5; }
  .dbtn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }
  .dbtn.danger { color: #e5484d; }
  .fld { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  dialog input:not([type=checkbox]), dialog select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; font-size: 14px; width: 100%; }
  dialog input:focus, dialog select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .pwr-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .dbtn.danger-fill { background: #e5484d; color: #fff; }
  .dbtn.danger-fill:disabled { background: var(--line); color: var(--muted); }
  .devs .check { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: 13px; }
  .add-row { display: grid; grid-template-columns: 1fr 1.6fr auto; gap: 8px; }
  .match-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; } .check { font-size: 12px; color: var(--muted); }
  .num { color: var(--muted); font-variant-numeric: tabular-nums; width: 22px; flex: none; font-size: 12px; }
  .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .down .nm { color: var(--muted); }
  main { display: flex; flex-direction: column; padding: 28px 32px; min-width: 0; gap: 20px; }
  header.top { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
  .chip, .btn, .link { white-space: nowrap; }
  header.top h2 { margin: 0; font-size: 22px; font-weight: 650; }
  .chip { padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .spacer { flex: 1; }
  .btn { padding: 9px 16px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
  .btn:disabled, .btn[aria-disabled=true] { opacity: .4; pointer-events: none; }
  .btn.stop { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .link { color: var(--muted); font-size: 12px; text-decoration: none; }
  .link:hover { color: var(--text); text-decoration: underline; }
  .screen.live { padding: 0; place-items: stretch; overflow: hidden; }
  .sel { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-size: 13px; }
  .stat { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .screen.native { place-items: center; background: #000; }
  .screen canvas { max-width: 100%; max-height: 100%; outline: none; cursor: default; }
  .screen iframe { width: 100%; height: 100%; border: 0; background: var(--screen); }
  .screen { flex: 1; min-height: 240px; border-radius: 14px; background: var(--screen); display: grid; place-items: center; text-align: center;
    color: var(--screen-text); border: 1px solid var(--line); padding: 24px; }
  .screen strong { display: block; color: #e8ebf0; font-size: 16px; margin-bottom: 4px; }
  .screen span { font-size: 13px; }
  .err { color: #b42318; background: color-mix(in srgb, #b42318 12%, transparent); padding: 10px 14px; border-radius: 8px; display: none; }
  @media (max-width: 720px) { body { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); } main { padding: 18px 16px; } }
</style>
</head>
<body>
<aside>
  <div class="brand"><div><h1 id="dev">KX Console</h1><p id="sub">Connecting…</p><p id="ver"></p><p><a class="link" id="signout" href="/login" hidden>Sign out</a></p></div>
    <button class="icon" id="cfgBtn" title="Settings: power devices and outlet mapping" aria-label="Settings">⚙︎</button></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Search targets  ( / )" aria-label="Search targets">
    <label class="check"><input type="checkbox" id="all"> Show unused ports</label>
  </div>
  <ul id="list"></ul>
  <section class="sessions" id="sessions" hidden><h3>Connected to the KX · <span id="scount">0</span></h3><ul id="slist"></ul></section>
</aside>
<main>
  <div class="err" id="err" role="alert"></div>
  <header class="top">
    <h2 id="title">Select a target</h2><span class="chip" id="state" hidden></span><span class="chip" id="type" hidden></span><span class="chip pwr" id="pwr" hidden></span>
    <span class="spacer"></span>
    <a class="link" id="raritan" target="_blank" rel="noopener" hidden>Open in Raritan’s client</a>
    <select id="clientMode" class="sel" aria-label="Console client" title="Console client. Native is the default; switch to the Raritan client if something doesn't work.">
      <option value="native">Native client</option><option value="raritan">Raritan client (classic)</option>
    </select>
    <select id="quality" class="sel" hidden aria-label="Video quality" title="Video quality. Auto lowers it on a slow link and raises it again when the link recovers.">
      <option value="auto">Quality: Auto</option><option value="13">Quality: High</option><option value="9">Quality: Medium</option><option value="5">Quality: Low</option>
    </select>
    <span class="stat" id="chint"></span><span class="stat" id="nstat"></span>
    <button class="btn stop" id="cad" hidden title="Send Ctrl-Alt-Del to the target">Ctrl-Alt-Del</button>
    <button class="btn stop" id="refreshVideo" hidden title="Ask the KX for a fresh video frame">Refresh video</button>
    <button class="btn stop" id="disconnectAll" title="End this page's console and every other client's console session on the KX">Disconnect all</button>
    <button class="btn" id="connect" disabled>Connect</button>
  </header>
  <section class="screen" id="screen"><div><strong>No target selected</strong><span>Pick a port on the left.</span></div></section>
</main>
<dialog id="cfgDlg"></dialog><dialog id="hostDlg"></dialog><dialog id="pwrDlg"></dialog>
<script src="/settings.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let ports = [], selected = null, device = null, connected = null, connecting = false;
let nativeClient = null, nativeRes = '';
let missed = 0, reconnects = []; // polls without an open console socket / recent auto-reconnect times

function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

function renderList() {
  const q = $('q').value.trim().toLowerCase(), all = $('all').checked, list = $('list');
  list.replaceChildren();
  const visible = ports.filter((p) => (all || p.configured) && (`${p.id} ${p.name}`).toLowerCase().includes(q));
  for (const [label, test] of [['Online', (p) => p.up], ['Offline', (p) => !p.up]]) {
    const group = visible.filter(test);
    if (!group.length) continue;
    list.append(Object.assign(el('li', 'group', `${label} · ${group.length}`)));
    for (const p of group) {
      const li = el('li', 'rowwrap'), b = el('button', `main ${p.up ? 'up' : 'down'}${p.busy ? ' busy' : ''}${connected === p.id ? ' mine' : ''}`);
      b.title = connected === p.id ? 'You are connected to this target' : p.busy ? 'In use by another client' : '';
      b.append(el('span', 'dot'), el('span', 'num', p.id), el('span', 'nm', p.name));
      const pw = typeof powerBadge === 'function' ? powerBadge(p) : null; // from settings.js
      if (pw) b.append(pw);
      if (selected === p.id) b.setAttribute('aria-current', 'true');
      b.onclick = () => select(p);
      const gear = el('button', 'gear', '⚙︎'); gear.title = 'Host settings'; gear.setAttribute('aria-label', `Settings for ${p.name}`);
      gear.onclick = (e) => { e.stopPropagation(); openHostSettings(p); };
      li.append(b, gear); list.append(li);
    }
  }
}

function renderDetail(keepScreen = false) {
  if (typeof updatePowerChip === 'function') { updatePowerChip(); updateClientHint(); }
  const p = ports.find((x) => x.id === selected);
  if (!p) return;
  $('title').textContent = p.name;
  const st = $('state'); st.hidden = false; st.className = 'chip' + (p.up ? ' ok' : '');
  st.textContent = connected === p.id ? 'Connected' : p.busy ? 'In use' : p.up ? 'Online' : 'Offline';
  const ty = $('type'); ty.hidden = false; ty.textContent = p.type;
  const link = $('raritan'); link.hidden = !p.up; link.href = `/api/ports/${p.id}/console`;
  const btn = $('connect'), live = connected === p.id;
  btn.disabled = !p.up && !live; btn.textContent = live ? 'Disconnect' : 'Connect'; btn.classList.toggle('stop', live);
  const nativeLive = Boolean(nativeClient) && live;
  $('cad').hidden = $('refreshVideo').hidden = $('quality').hidden = !nativeLive;
  if (live || keepScreen || connecting) return; // keep the running session / status text; polling must not rebuild them
  const s = $('screen'); s.className = 'screen'; s.replaceChildren(); const d = el('div');
  d.append(el('strong', null, p.up ? 'Ready to connect' : 'Target is offline'),
    el('span', null, p.up ? 'The KX allows one remote channel at a time.' : 'No video signal on this port.'));
  s.append(d);
}

function message(title, detail) {
  const s = $('screen'); s.className = 'screen'; s.replaceChildren(); const d = el('div');
  d.append(el('strong', null, title), el('span', null, detail)); s.append(d);
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const BUSY = /Maximum number of KVM connections/i;
let attempt = 0; // bumped on every connect/disconnect so a stale connect() stops itself

// Clicking a host connects to it and drops whatever was connected before.
function select(p) {
  selected = p.id; renderList();
  if (p.up) connect(p); else { disconnect(); renderDetail(); }
}

// Restyle Raritan's client to match the dashboard. The iframe is same-origin, so we can add our stylesheet.
function themeClient(frame) {
  try {
    const doc = frame.contentDocument;
    if (doc.getElementById('kxc-theme')) return;
    const link = doc.createElement('link');
    link.id = 'kxc-theme'; link.rel = 'stylesheet'; link.href = '/hkc-theme.css';
    doc.head.append(link);
  } catch { /* cross-origin or not ready: the stock look is fine */ }
}

// The KX has one remote channel, and it only frees up after the old client's WebSocket closes.
// Removing the iframe closes it; if the KX still says "busy" (the iframe is same-origin, so we can read
// its dialog), tear down and retry.
async function connect(p = ports.find((x) => x.id === selected), reason) {
  if (!p) return;
  const mine = ++attempt;
  closeNative(); // a previous native console must close first, or it keeps holding the KX's single channel
  connecting = true; connected = null; $('screen').replaceChildren(); renderDetail(true);
  const btn = $('connect'); btn.disabled = true; btn.textContent = 'Connecting…';
  try {
    const r = await fetch('/api/session'); const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    // The KX has one remote channel: end whoever else holds a console so ours can take it.
    try { await post('/api/sessions/disconnect-all'); } catch { /* fall back to the retry loop below */ }
    const native = (cfg.hosts?.[p.id]?.client || clientMode()) === 'native'; // per-host override from settings.js
    const tries = native ? 12 : 6; // the KX keeps a port marked busy for ~30 s after a disconnect
    for (let i = 0; i < tries; i++) {
      message('Connecting to ' + p.name, i ? `Waiting for the KX to free its channel (try ${i + 1}/${tries})…` : reason ?? 'Releasing the previous session…');
      await sleep(i ? 2500 : 1200);
      if (mine !== attempt) return;
      const s = $('screen');
      let busy = false;
      if (native) {
        const canvas = el('canvas'); canvas.setAttribute('aria-label', p.name);
        s.className = 'screen live native'; s.replaceChildren(canvas);
        let failure = null;
        const { KxClient } = await import('/native/kxclient.js');
        const kx = new KxClient({
          canvas, portNo: p.id, // same numbering as the KX port list
          quality: qualityMode(), pacing: pref('kxc-pacing', 'fast'), depth: Number(pref('kxc-depth', '2')),
          onstatus: (st) => { if (nativeClient === kx) $('nstat').textContent = st; },
          onerror: (e) => { failure = e; },
          onresolution: ({ width, height }) => { nativeRes = `${width}×${height}`; },
          onstats: ({ fps, kbps, delay, quality, auto }) => { if (nativeClient === kx) $('nstat').textContent = `${nativeRes} · ${fps} fps · ${kbps} kbit/s${delay === null ? '' : ` · ${delay} ms`} · Q${quality}${auto ? ' auto' : ''}`; },
        });
        nativeClient = kx; // set before connecting so disconnect() can always tear it down
        try { await kx.connect(); } catch (e) { failure = e; }
        connected = p.id; renderList(); renderDetail(true);
        await sleep(4000); // let the handshake finish before judging the result
        if (mine !== attempt) return;
        busy = Boolean(failure) || !kx.ws;
        if (!busy) canvas.focus();
      } else {
        const n = p.id - 1; // HKC numbers ports from 0
        const hash = new URLSearchParams({
          portId: `P_${device.deviceId}_${n}`, portNo: n, channelName: p.name, portType: p.type, portPermission: 'CCC',
          appId: `${Date.now()}_${Math.floor(Math.random() * 1e15)}`, embedded: 'true', numberOfTargets: '1',
        });
        // HKC defaults "Scale Video" to off. It reads localStorage.scaleMode at connect and its settings dialog writes
        // the same key, so seed it to on only when the user never chose (the iframe shares our origin).
        try { if (localStorage.getItem('scaleMode') === null) localStorage.setItem('scaleMode', 'true'); } catch { /* no storage */ }
        const frame = el('iframe'); frame.title = p.name; frame.allow = 'clipboard-read; clipboard-write; fullscreen';
        frame.src = `/jsclient/Client.asp#${hash}`;
        frame.addEventListener('load', () => themeClient(frame));
        s.className = 'screen live'; s.replaceChildren(frame);
        connected = p.id; renderList(); renderDetail(true);
        await sleep(4000);
        if (mine !== attempt) return;
        try { busy = BUSY.test(frame.contentDocument.body.innerText); } catch { /* not readable: assume fine */ }
      }
      if (!busy) { connecting = false; return; }
      closeNative(); connected = null; renderList(); s.replaceChildren(); // drop the failed client so the KX releases the channel
    }
    throw new Error('The KX still reports its remote channel as in use. Another client may be connected (see the list at the bottom left).' + (native ? ' If native connections keep failing, try the Raritan client in the selector.' : ''));
  } catch (e) {
    if (mine === attempt) { connecting = false; connected = null; message('Could not connect', e.message); renderList(); renderDetail(true); }
  }
}

// The proxy counts open console sockets. If we think we're connected but none is open for two polls
// (KX dropped us, session expired, laptop slept), reconnect, but give up after 3 tries in 2 minutes.
function checkLink(rfbOpen) {
  if (connected == null || connecting) { missed = 0; return; }
  missed = rfbOpen === 0 ? missed + 1 : 0;
  if (missed < 2) return;
  missed = 0;
  const now = Date.now(), p = ports.find((x) => x.id === connected);
  reconnects = reconnects.filter((t) => now - t < 120000);
  if (!p) return;
  if (reconnects.length >= 3) {
    disconnect(); message('Connection lost', 'Reconnecting failed 3 times in 2 minutes. Click Connect to try again.'); renderDetail(true);
    return;
  }
  reconnects.push(now); connect(p, 'Connection lost. Reconnecting…');
}

async function post(path, body = {}) {
  const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error);
  return data;
}

function renderSessions(sessions) {
  const box = $('slist'); box.replaceChildren();
  for (const s of [...sessions].sort((a, b) => Number(!!b.portId) - Number(!!a.portId))) {
    const li = el('li'), top = el('div', 'row');
    const name = s.portId ? (s.portName ?? `Port ${s.port}`) : 'Web login';
    top.append(el('span', s.portId ? 'tag live' : 'tag', s.self ? `${name} · this dashboard` : name));
    if (s.portId || (!s.self && s.id)) {
      const btn = el('button', 'mini', s.portId ? 'Disconnect' : 'Log off');
      btn.title = s.portId ? 'End this console session' : 'Force this web login off the KX';
      btn.onclick = async () => {
        if (!s.portId && !confirm(`Log ${s.user} (${s.from}) off the KX?`)) return;
        btn.disabled = true;
        try { renderSessions((await post('/api/sessions/disconnect', { id: s.id, mode: s.portId ? 'port' : 'logoff' })).sessions); load(); }
        catch (e) { $('err').textContent = e.message; $('err').style.display = 'block'; btn.disabled = false; }
      };
      top.append(btn);
    }
    li.append(top, el('span', 'meta', `${s.user} · ${s.from} · ${s.status}`));
    box.append(li);
  }
  $('scount').textContent = sessions.length; $('sessions').hidden = !sessions.length;
}

async function loadSessions() {
  try {
    const r = await fetch('/api/sessions'); const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    renderSessions(data.sessions);
  } catch { $('sessions').hidden = true; } // no KX login or SSH set up: the panel just stays hidden
}

// Which console client to use: our native client (default) or Raritan's embedded HKC as the classic fallback.
const clientMode = () => $('clientMode').value;
const qualityMode = () => ($('quality').value === 'auto' ? 'auto' : Number($('quality').value));
const pref = (key, fallback) => { try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; } }; // dev switches: kxc-pacing, kxc-depth
function closeNative() { const kx = nativeClient; nativeClient = null; kx?.disconnect(); $('nstat').textContent = ''; }

function disconnect() { attempt++; closeNative(); connecting = false; connected = null; $('screen').replaceChildren(); renderList(); renderDetail(); }

try { const v = localStorage.getItem('kxc-quality'); if (v && [...$('quality').options].some((o) => o.value === v)) $('quality').value = v; } catch { /* no storage */ }
$('quality').onchange = () => { try { localStorage.setItem('kxc-quality', $('quality').value); } catch { /* no storage */ } nativeClient?.setQuality(qualityMode()); };
$('cfgBtn').onclick = () => openSettings();
$('connect').onclick = () => (connected != null ? disconnect() : connect());
try { const v = localStorage.getItem('kxc-client'); if (['raritan', 'native'].includes(v)) $('clientMode').value = v; } catch { /* no storage */ }
$('clientMode').onchange = () => {
  try { localStorage.setItem('kxc-client', clientMode()); } catch { /* no storage */ }
  if (connected != null) connect(); // switch the running console to the other client
};
$('cad').onclick = () => { const p = ports.find((x) => x.id === connected); if (p && confirm(`Send Ctrl-Alt-Del to ${p.name}?`)) nativeClient?.sendCtrlAltDel(); };
$('refreshVideo').onclick = () => nativeClient?.refreshVideo();
$('signout').onclick = async (e) => { e.preventDefault(); disconnect(); await post('/api/logout').catch(() => {}); location.href = '/login'; };
// Ends this page's console and every other client's console session on the KX (never the app's own web login).
$('disconnectAll').onclick = async () => {
  disconnect(); message('Disconnecting everyone…', 'Ending console sessions on the KX.'); renderDetail(true);
  try {
    const d = await post('/api/sessions/disconnect-all');
    message('Disconnected', d.disconnected ? `Ended ${d.disconnected} other console session${d.disconnected > 1 ? 's' : ''}. Pick a target to connect.` : 'No other console sessions were open. Pick a target to connect.');
    renderSessions(d.sessions); load();
  } catch (e) { message('Could not end the other sessions', e.message); }
};

async function load() {
  try {
    const r = await fetch('/api/ports'); const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    ports = data.ports; device = data.device; $('err').style.display = 'none';
    if (selected == null) selected = ports.find((p) => p.up)?.id ?? null;
    $('ver').textContent = `KX Console v${data.version}`;
    $('signout').hidden = !data.auth;
    $('dev').textContent = data.device.name; $('sub').textContent = `${data.device.model} · ${data.device.host}`;
    renderList(); renderDetail(); checkLink(data.rfbOpen);
  } catch (e) { $('err').textContent = e.message; $('err').style.display = 'block'; }
}

$('q').oninput = $('all').onchange = renderList;
addEventListener('keydown', (e) => { if (e.key === '/' && document.activeElement !== $('q') && document.activeElement?.tagName !== 'CANVAS') { e.preventDefault(); $('q').focus(); } });
load(); setInterval(load, 5000);
loadSessions(); setInterval(loadSessions, 10000);
</script>
</body>
